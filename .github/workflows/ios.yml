name: Build iOS (Xcode & IPA)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App & Xcode Project
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2 & iOS Export Templates
        run: |
          echo "Downloading Godot 4.7.2 macOS editor..."
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q godot.zip

          echo "Downloading Godot 4.7.2 export templates..."
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable
          unzip -q templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable/
          echo "Godot and export templates ready."

      - name: Export iOS Project
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" "build/ios/chrono-chess-5d.ipa" || true
          ls -la build/ios

      - name: Build with xcodebuild
        run: |
          cd build/ios
          xcodebuild -project chrono-chess-5d.xcodeproj \
            -scheme "chrono-chess-5d" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA and Xcode Project
        run: |
          cd build/ios
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr ../../chrono-chess-5d-v1.9-unsigned.ipa Payload

          echo "Packaging complete Xcode project..."
          cd ../..
          zip -qr chrono-chess-5d-xcode-project.zip build/ios/chrono-chess-5d.xcodeproj build/ios/chrono-chess-5d build/ios/*.xcframework build/ios/*.pck build/ios/*.xcprivacy

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-chess-5d-ios-ipa
          path: chrono-chess-5d-v1.9-unsigned.ipa

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-chess-5d-xcode-project
          path: chrono-chess-5d-xcode-project.zip

      - name: Attach to GitHub Release (if triggered by release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chrono-chess-5d-v1.9-unsigned.ipa
            chrono-chess-5d-xcode-project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

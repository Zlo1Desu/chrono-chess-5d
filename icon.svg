<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 1. ГЛУБОКИЙ ГРАФИТОВО-СЛАНЦЕВЫЙ ФОН (#0B0F19) В СТИЛЕ ИГРЫ -->
  <rect width="512" height="512" rx="112" fill="#0B0F19"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="#111827" stroke="#24324B" stroke-width="4"/>

  <!-- Внутренний гербовый медальон (сдержанный сланцевый круг с тонким латунным ободом) -->
  <circle cx="256" cy="256" r="204" fill="#0D1320" stroke="#1E2B42" stroke-width="6"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#C89B3C" stroke-width="3" opacity="0.75"/>

  <!-- Тонкие деления хронометра по ободу медальона -->
  <g transform="translate(256, 256)" stroke="#C89B3C" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="-188" x2="0" y2="-172" stroke-width="5"/>
    <line x1="188" y1="0" x2="172" y2="0" stroke-width="5"/>
    <line x1="0" y1="188" x2="0" y2="172" stroke-width="5"/>
    <line x1="-188" y1="0" x2="-172" y2="0" stroke-width="5"/>
    <line x1="133" y1="-133" x2="122" y2="-122" stroke-width="3.5"/>
    <line x1="-133" y1="-133" x2="-122" y2="-122" stroke-width="3.5"/>
    <line x1="133" y1="133" x2="122" y2="122" stroke-width="3.5"/>
    <line x1="-133" y1="133" x2="-122" y2="122" stroke-width="3.5"/>
  </g>

  <!-- 2. ВЕРХНЯЯ ДОСКА ПРОШЛОГО / АЛЬТЕРНАТИВНОЙ ВЕТВИ (L+1, СЛЕВА) -->
  <g transform="translate(182, 292)">
    <!-- Контактная тень верхней доски -->
    <polygon points="0,-50 132,6 0,62 -132,6" fill="#060911" opacity="0.75"/>
    <!-- Боковая толщина доски L+1 -->
    <polygon points="-124,0 0,48 0,66 -124,18" fill="#2A4368" stroke="#14110E" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="0,48 124,0 124,18 0,66" fill="#1B2C47" stroke="#14110E" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- Верхняя плоскость доски L+1 -->
    <polygon points="0,-48 124,0 0,48 -124,0" fill="#24344E" stroke="#589AF8" stroke-width="5" stroke-linejoin="round"/>
    <!-- Клетки 2x2 -->
    <polygon points="0,-38 50,-19 0,0 -50,-19" fill="#DCE3EE"/>
    <polygon points="0,0 50,19 0,38 -50,19" fill="#C6D2E4"/>
    <polygon points="-50,-19 0,0 -50,19 -100,0" fill="#2B3E5E"/>
    <polygon points="50,-19 100,0 50,19 0,0" fill="#22324D"/>
    <polygon points="0,-38 100,0 0,38 -100,0" fill="none" stroke="#14110E" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- 3. ТЁМНЫЙ КОРОЛЬ СТАУНТОН (СТОИТ НА ВЕРХНЕЙ ДОСКЕ L+1) -->
  <g transform="translate(182, 186) scale(1.62)">
    <!-- Контактная тень на доске L+1 -->
    <ellipse cx="0" cy="60" rx="38" ry="10" fill="#080C14" opacity="0.7"/>

    <!-- Крест Стаунтона на вершине -->
    <path d="M -5 -68 L 5 -68 L 5 -58 L 14 -58 L 14 -48 L 5 -48 L 5 -36 L -5 -36 L -5 -48 L -14 -48 L -14 -58 L -5 -58 Z" fill="#E0B44C"/>
    <path d="M 0 -68 L 5 -68 L 5 -58 L 14 -58 L 14 -48 L 5 -48 L 5 -36 L 0 -36 Z" fill="#B08428"/>
    <path d="M -5 -68 L 5 -68 L 5 -58 L 14 -58 L 14 -48 L 5 -48 L 5 -36 L -5 -36 L -5 -48 L -14 -48 L -14 -58 L -5 -58 Z" fill="none" stroke="#14110E" stroke-width="4.2" stroke-linejoin="round"/>

    <!-- Купол короны -->
    <path d="M -22 -22 C -22 -42, 22 -42, 22 -22 Z" fill="#E0B44C" stroke="#14110E" stroke-width="4.2" stroke-linejoin="round"/>

    <!-- Корпус короля (двухтоновый cel-shading: сапфировый сланец) -->
    <path d="M -25 36 L -31 -22 C -16 -30, 16 -30, 31 -22 L 25 36 Z" fill="#324768"/>
    <path d="M 0 -28 C 16 -28, 31 -22, 31 -22 L 25 36 L 0 36 Z" fill="#1E2C44"/>
    <path d="M -25 36 L -31 -22 C -16 -30, 16 -30, 31 -22 L 25 36 Z" fill="none" stroke="#14110E" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Латунный воротник -->
    <rect x="-28" y="-12" width="56" height="9" rx="4.5" fill="#E0B44C" stroke="#14110E" stroke-width="4"/>
    <rect x="0" y="-10" width="26" height="5" fill="#B08428"/>

    <!-- Вертикальная грань -->
    <line x1="0" y1="-2" x2="0" y2="34" stroke="#4A6896" stroke-width="3" stroke-linecap="round"/>

    <!-- Латунное кольцо основания -->
    <rect x="-29" y="32" width="58" height="9" rx="4.5" fill="#E0B44C" stroke="#14110E" stroke-width="4"/>

    <!-- Ступенчатый пьедестал -->
    <path d="M -38 56 C -38 43, -29 39, -24 39 L 24 39 C 29 39, 38 43, 38 56 Z" fill="#324768"/>
    <path d="M 0 39 L 24 39 C 29 39, 38 43, 38 56 L 0 56 Z" fill="#1E2C44"/>
    <path d="M -38 56 C -38 43, -29 39, -24 39 L 24 39 C 29 39, 38 43, 38 56 Z" fill="none" stroke="#14110E" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="-41" y="52" width="82" height="9" rx="4.5" fill="#162032" stroke="#14110E" stroke-width="4.2"/>
  </g>

  <!-- 4. ГЛАВНАЯ НИЖНЯЯ ДОСКА НАСТОЯЩЕГО (L0, СПРАВА-ВНИЗУ) -->
  <g transform="translate(284, 398)">
    <!-- Контактная тень доски -->
    <polygon points="0,-64 172,6 0,76 -172,6" fill="#060911" opacity="0.82"/>
    <!-- Боковая толщина доски (латунно-золотая рамка активной доски Present) -->
    <polygon points="-160,0 0,60 0,82 -160,22" fill="#9E7628" stroke="#14110E" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,60 160,0 160,22 0,82" fill="#6E4F16" stroke="#14110E" stroke-width="6" stroke-linejoin="round"/>
    <!-- Верхняя плоскость доски -->
    <polygon points="0,-60 160,0 0,60 -160,0" fill="#1E2B40" stroke="#D4A843" stroke-width="6" stroke-linejoin="round"/>
    <!-- Шахматные клетки в строгом cel-shaded стиле -->
    <polygon points="0,-48 64,-24 0,0 -64,-24" fill="#EAE0CE"/>
    <polygon points="0,0 64,24 0,48 -64,24" fill="#DFD2BC"/>
    <polygon points="-64,-24 0,0 -64,24 -128,0" fill="#2B3D5B"/>
    <polygon points="64,-24 128,0 64,24 0,0" fill="#213049"/>
    <polygon points="0,-48 128,0 0,48 -128,0" fill="none" stroke="#14110E" stroke-width="4" stroke-linejoin="round"/>
    <line x1="-64" y1="-24" x2="64" y2="24" stroke="#14110E" stroke-width="3.5"/>
    <line x1="64" y1="-24" x2="-64" y2="24" stroke="#14110E" stroke-width="3.5"/>
  </g>

  <!-- 5. ДУГА ПРЫЖКА ВО ВРЕМЕНИ (ОТ ДОСКИ L0 К ДОСКЕ L+1) -->
  <path d="M 158 398 C 88 380, 68 308, 102 252" fill="none" stroke="#14110E" stroke-width="16" stroke-linecap="round"/>
  <path d="M 158 398 C 88 380, 68 308, 102 252" fill="none" stroke="#E0B44C" stroke-width="8" stroke-linecap="round"/>
  <polygon points="118,238 82,242 108,270" fill="#E0B44C" stroke="#14110E" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- 6. СВЕТЛЫЙ КОНЬ СТАУНТОН (НА ПЕРЕДНЕМ ПЛАНЕ НА ДОСКЕ L0) -->
  <g transform="translate(302, 266) scale(1.88)">
    <!-- Контактная тень -->
    <ellipse cx="0" cy="60" rx="40" ry="11" fill="#060911" opacity="0.75"/>

    <!-- Резной профиль боевого коня (2-тоновый cel-shading слоновой кости) -->
    <path d="M -25 36 C -27 12, -19 -6, -8 -18 L -27 -11 C -34 -11, -38 -18, -34 -25 L -16 -46 L -14 -60 L -2 -51 C 18 -48, 31 -29, 29 0 C 28 16, 25 27, 27 36 Z" fill="#F7F3E8"/>

    <!-- Теневая правая часть шеи и гривы -->
    <path d="M -2 -51 C 18 -48, 31 -29, 29 0 C 28 16, 25 27, 27 36 L 6 36 C 9 14, 10 -12, -2 -34 Z" fill="#DFD2BC"/>

    <!-- Резная ступенчатая грива (латунный акцент) -->
    <path d="M 9 -43 C 23 -32, 29 -12, 25 14 L 16 14 C 19 -8, 15 -25, 4 -35 Z" fill="#D4A843"/>

    <!-- Светлый блик вдоль морды и груди -->
    <path d="M -13 -43 L -29 -23 M -9 -10 C -17 4, -20 18, -19 31" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Выразительный глаз и ноздря -->
    <circle cx="-13" cy="-35" r="3.4" fill="#181410"/>
    <circle cx="-27" cy="-19" r="2.0" fill="#181410"/>

    <!-- Внешний чёткий контур головы коня -->
    <path d="M -25 36 C -27 12, -19 -6, -8 -18 L -27 -11 C -34 -11, -38 -18, -34 -25 L -16 -46 L -14 -60 L -2 -51 C 18 -48, 31 -29, 29 0 C 28 16, 25 27, 27 36 Z" fill="none" stroke="#181410" stroke-width="4.4" stroke-linejoin="round"/>

    <!-- Латунное кольцо основания -->
    <rect x="-29" y="32" width="58" height="9" rx="4.5" fill="#D4A843" stroke="#181410" stroke-width="4"/>
    <rect x="0" y="34" width="27" height="5" fill="#A67B22"/>

    <!-- Ступенчатый пьедестал Стаунтон -->
    <path d="M -38 56 C -38 43, -29 39, -24 39 L 24 39 C 29 39, 38 43, 38 56 Z" fill="#F7F3E8"/>
    <path d="M 0 39 L 24 39 C 29 39, 38 43, 38 56 L 0 56 Z" fill="#DFD2BC"/>
    <path d="M -38 56 C -38 43, -29 39, -24 39 L 24 39 C 29 39, 38 43, 38 56 Z" fill="none" stroke="#181410" stroke-width="4.4" stroke-linejoin="round"/>
    <rect x="-41" y="52" width="82" height="9" rx="4.5" fill="#C4B294" stroke="#181410" stroke-width="4.2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Глубокий космический фон мультивселенной -->
    <radialGradient id="bg_cosmos" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1d336e"/>
      <stop offset="48%" stop-color="#0b132c"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>

    <!-- Квантовое свечение в центре -->
    <radialGradient id="nebula_cyan" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#3a66ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula_gold" cx="50%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff6b00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Золотой градиент короны и астролябии -->
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="32%" stop-color="#ffd166"/>
      <stop offset="68%" stop-color="#f49d1a"/>
      <stop offset="100%" stop-color="#a85000"/>
    </linearGradient>

    <!-- Неоновый циановый градиент времени -->
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ffff"/>
      <stop offset="40%" stop-color="#3df5ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Пурпурный градиент парадокса -->
    <linearGradient id="violet_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c4fb"/>
      <stop offset="45%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#480ca8"/>
    </linearGradient>

    <!-- Градиент корпуса Короля (слоновая кость + звездный металл) -->
    <linearGradient id="king_body" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#f0f5ff"/>
      <stop offset="68%" stop-color="#b8c9e8"/>
      <stop offset="100%" stop-color="#5670a4"/>
    </linearGradient>

    <!-- Тёмная броня Короля -->
    <linearGradient id="king_armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c4373"/>
      <stop offset="50%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Градиент изометрической доски -->
    <linearGradient id="board_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <!-- Рамка иконки -->
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3df5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffd166" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b5179e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 1. БАЗОВЫЙ ФОН И ВНЕШНЯЯ РАМКА -->
  <rect width="512" height="512" rx="108" fill="url(#bg_cosmos)"/>
  <circle cx="256" cy="240" r="245" fill="url(#nebula_cyan)"/>
  <circle cx="256" cy="175" r="190" fill="url(#nebula_gold)"/>

  <!-- Внутренний ювелирный кант иконки -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#border_grad)" stroke-width="4.5" opacity="0.8"/>

  <!-- 2. ФОНОВЫЕ ПАРЯЩИЕ ДОСКИ МУЛЬТИВСЕЛЕННОЙ (Временные ветки L-1 и L+1) -->
  <g opacity="0.34" transform="translate(46, 60) rotate(-14)">
    <polygon points="58,0 116,28 58,56 0,28" fill="#0d1b38" stroke="#3df5ff" stroke-width="2.5"/>
    <polygon points="58,0 87,14 58,28 29,14" fill="#3df5ff" opacity="0.5"/>
    <polygon points="58,28 87,42 58,56 29,42" fill="#3df5ff" opacity="0.5"/>
  </g>
  <g opacity="0.34" transform="translate(352, 44) rotate(14)">
    <polygon points="58,0 116,28 58,56 0,28" fill="#1f1135" stroke="#ffd166" stroke-width="2.5"/>
    <polygon points="58,0 87,14 58,28 29,14" fill="#ffd166" opacity="0.5"/>
    <polygon points="58,28 87,42 58,56 29,42" fill="#ffd166" opacity="0.5"/>
  </g>

  <!-- Звёздная пыль -->
  <g fill="#ffffff">
    <circle cx="68" cy="184" r="2.4" opacity="0.7"/>
    <circle cx="444" cy="192" r="2.6" opacity="0.75"/>
    <circle cx="80" cy="348" r="2.0" opacity="0.55"/>
    <circle cx="432" cy="352" r="2.2" opacity="0.65"/>
    <circle cx="148" cy="54" r="2.0" opacity="0.55"/>
    <circle cx="364" cy="58" r="2.0" opacity="0.55"/>
  </g>

  <!-- 3. ХРОНО-АСТРОЛЯБИЯ (КОЛЬЦА ВРЕМЕНИ) -->
  <g transform="translate(256, 224)">
    <!-- Внешнее свечение кольца -->
    <circle r="180" fill="none" stroke="#00f0ff" stroke-width="14" opacity="0.12"/>
    <circle r="170" fill="none" stroke="url(#cyan_grad)" stroke-width="3" opacity="0.7" stroke-dasharray="30 10 6 10"/>

    <!-- Главное золотое часовое кольцо -->
    <circle r="154" fill="none" stroke="url(#gold_grad)" stroke-width="5.5" opacity="0.92"/>
    <circle r="140" fill="none" stroke="#ffd166" stroke-width="1.8" opacity="0.42" stroke-dasharray="8 8"/>

    <!-- Деления циферблата -->
    <g stroke="url(#gold_grad)" stroke-width="4.5" stroke-linecap="round">
      <line x1="0" y1="-154" x2="0" y2="-168"/>
      <line x1="154" y1="0" x2="168" y2="0"/>
      <line x1="0" y1="154" x2="0" y2="168"/>
      <line x1="-154" y1="0" x2="-168" y2="0"/>
      <line x1="109" y1="-109" x2="120" y2="-120"/>
      <line x1="-109" y1="-109" x2="-120" y2="-120"/>
      <line x1="109" y1="109" x2="120" y2="120"/>
      <line x1="-109" y1="109" x2="-120" y2="120"/>
    </g>

    <!-- Внутренние квантовые орбиты (эллипсы 5D переходов) -->
    <ellipse rx="164" ry="62" transform="rotate(-26)" fill="none" stroke="url(#cyan_grad)" stroke-width="3.5" opacity="0.5"/>
    <ellipse rx="164" ry="62" transform="rotate(26)" fill="none" stroke="url(#violet_grad)" stroke-width="3.5" opacity="0.5"/>
  </g>

  <!-- 4. ИЗОМЕТРИЧЕСКАЯ ШАХМАТНАЯ ПЛАТФОРМА МУЛЬТИВСЕЛЕННОЙ (ВНИЗУ) -->
  <g transform="translate(256, 400)">
    <!-- Тень и неоновая подложка доски -->
    <polygon points="0,-72 184,0 0,72 -184,0" fill="#00f0ff" opacity="0.20"/>
    <polygon points="0,-62 164,6 0,74 -164,6" fill="#050914" opacity="0.9"/>

    <!-- Объёмная боковая грань доски -->
    <polygon points="-164,0 0,66 164,0 164,18 0,84 -164,18" fill="url(#king_armor)" stroke="url(#gold_grad)" stroke-width="3"/>

    <!-- Верхняя плоскость доски 4x4 -->
    <polygon points="0,-66 164,0 0,66 -164,0" fill="url(#board_base)" stroke="url(#cyan_grad)" stroke-width="3.5"/>

    <!-- Светящиеся клетки в перспективе -->
    <polygon points="0,-33 82,0 0,33 -82,0" fill="#3df5ff" opacity="0.22"/>
    <polygon points="0,0 41,16.5 0,33 -41,16.5" fill="#ffd166" opacity="0.5"/>
    <polygon points="0,-33 41,-16.5 0,0 -41,-16.5" fill="#3df5ff" opacity="0.48"/>
    <polygon points="-82,0 -41,-16.5 0,0 -41,16.5" fill="#0e2042" opacity="0.92"/>
    <polygon points="82,0 41,-16.5 0,0 41,16.5" fill="#0e2042" opacity="0.92"/>
    <polygon points="-123,0 -82,-16.5 -41,0 -82,16.5" fill="#3df5ff" opacity="0.34"/>
    <polygon points="123,0 82,-16.5 41,0 82,16.5" fill="#3df5ff" opacity="0.34"/>
    <polygon points="0,33 41,16.5 82,33 41,49.5" fill="#3df5ff" opacity="0.30"/>
    <polygon points="0,33 -41,16.5 -82,33 -41,49.5" fill="#3df5ff" opacity="0.30"/>
  </g>

  <!-- 5. БОКОВЫЕ ФИГУРЫ-СПУТНИКИ (ХРОНО-КОНЬ СЛЕВА И КВАНТОВАЯ КОРОЛЕВА СПРАВА) -->
  <!-- Левый спутник: Неоновый Хроно-Конь (Временной скачок в прошлое) -->
  <g transform="translate(154, 286) scale(0.76)" opacity="0.88">
    <!-- База коня -->
    <path d="M-52,110 L52,110 L42,88 L-42,88 Z" fill="url(#king_armor)" stroke="url(#cyan_grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Силуэт боевого коня -->
    <path d="M-34,88 C-34,36 -28,-6 -12,-38 L-28,-32 L-46,-46 L-38,-62 L-14,-78 L-10,-98 L10,-82 C34,-68 44,-32 32,12 C26,38 34,66 36,88 Z"
          fill="url(#king_armor)" stroke="url(#cyan_grad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Светящаяся грива и глаз коня -->
    <path d="M4,-76 C22,-62 30,-32 20,8 C15,30 22,58 24,82" fill="none" stroke="#3df5ff" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <circle cx="-18" cy="-58" r="4.5" fill="#3df5ff"/>
  </g>

  <!-- Правый спутник: Пурпурно-Золотая Ферзь (Временной скачок в будущее) -->
  <g transform="translate(358, 286) scale(0.76)" opacity="0.88">
    <!-- База ферзя -->
    <path d="M-52,110 L52,110 L42,88 L-42,88 Z" fill="url(#king_armor)" stroke="url(#violet_grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Торс ферзя -->
    <path d="M-34,88 C-30,42 -20,0 -24,-32 L24,-32 C20,0 30,42 34,88 Z" fill="url(#king_armor)" stroke="url(#violet_grad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Корона ферзя -->
    <path d="M-28,-32 L-42,-78 L-14,-52 L0,-86 L14,-52 L42,-78 L28,-32 Z" fill="url(#violet_grad)" stroke="url(#gold_grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-42" cy="-84" r="5" fill="#ffd166"/>
    <circle cx="0" cy="-92" r="5.5" fill="#ffd166"/>
    <circle cx="42" cy="-84" r="5" fill="#ffd166"/>
  </g>

  <!-- 6. ЦЕНТРАЛЬНАЯ ФИГУРА: ИМПЕРСКИЙ ХРОНО-КОРОЛЬ -->
  <g transform="translate(256, 232)">
    <!-- Энергетическая аура вокруг фигуры -->
    <ellipse cx="0" cy="34" rx="78" ry="128" fill="#00f0ff" opacity="0.16"/>

    <!-- Пьедестал (база фигуры) -->
    <path d="M-76,150 C-76,168 76,168 76,150 L68,128 C68,142 -68,142 -68,128 Z" fill="url(#gold_grad)" stroke="#091124" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-66,130 C-66,144 66,144 66,130 L52,104 L-52,104 Z" fill="url(#king_armor)" stroke="url(#gold_grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-54" y="95" width="108" height="13" rx="6.5" fill="url(#gold_grad)" stroke="#091124" stroke-width="3.5"/>

    <!-- Главная колонна (торс Короля с гранёными пластинами) -->
    <path d="M-45,95 C-40,38 -26,-6 -31,-44 L31,-44 C26,-6 40,38 45,95 Z" fill="url(#king_body)" stroke="#091124" stroke-width="5" stroke-linejoin="round"/>

    <!-- Тёмные сапфировые грани по бокам торса для 3D-объёма -->
    <path d="M-42,93 C-37,40 -25,-4 -29,-42 L-14,-42 C-12,-4 -19,40 -21,93 Z" fill="#1d3566" opacity="0.55"/>
    <path d="M42,93 C37,40 25,-4 29,-42 L14,-42 C12,-4 19,40 21,93 Z" fill="#0d1b3a" opacity="0.65"/>

    <!-- Встроенное ядро Песочных Часов Времени (в груди Короля) -->
    <polygon points="-22,-12 22,-12 6,22 22,56 -22,56 -6,22" fill="#071126" stroke="url(#gold_grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-14,-6 14,-6 2,18 -2,18" fill="url(#cyan_grad)"/>
    <polygon points="-2,26 2,26 14,50 -14,50" fill="url(#cyan_grad)"/>
    <circle cx="0" cy="22" r="5" fill="#ffffff"/>

    <!-- Золотой воротник под короной -->
    <rect x="-40" y="-55" width="80" height="14" rx="7" fill="url(#gold_grad)" stroke="#091124" stroke-width="3.5"/>

    <!-- Имперская Корона Короля -->
    <path d="M-38,-55 L-52,-104 L-22,-78 L0,-112 L22,-78 L52,-104 L38,-55 Z" fill="url(#gold_grad)" stroke="#091124" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Внутренний бархат короны -->
    <path d="M-32,-57 L-40,-89 L-18,-70 L0,-97 L18,-70 L40,-89 L32,-57 Z" fill="url(#king_armor)" opacity="0.78"/>

    <!-- Драгоценные камни в зубцах короны -->
    <circle cx="0" cy="-73" r="6.5" fill="#3df5ff" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="-25" cy="-69" r="4.8" fill="#ff4d6d" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="25" cy="-69" r="4.8" fill="#3df5ff" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Королевский 5D-крест / Звезда Хроноса на вершине -->
    <g transform="translate(0, -142)">
      <circle cx="0" cy="0" r="28" fill="#00f0ff" opacity="0.30"/>
      <polygon points="-8,-26 8,-26 6,-6 26,-8 26,8 6,6 8,26 -8,26 -6,6 -26,8 -26,-8 -6,-6" fill="url(#gold_grad)" stroke="#091124" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#3df5ff" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 7. 4-ЛУЧЕВЫЕ ЗВЁЗДЫ-ВСПЫШКИ -->
  <g>
    <polygon points="94,116 98,128 110,132 98,136 94,148 90,136 78,132 90,128" fill="#3df5ff"/>
    <polygon points="418,116 422,128 434,132 422,136 418,148 414,136 402,132 414,128" fill="#ffd166"/>
    <polygon points="82,292 85,300 93,303 85,306 82,314 79,306 71,303 79,300" fill="#ffffff"/>
    <polygon points="430,292 433,300 441,303 433,306 430,314 427,306 419,303 427,300" fill="#ffffff"/>
  </g>
</svg>
